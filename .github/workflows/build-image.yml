name: build-image

# Builds the flashable Tesla-Pi image and attaches it to a GitHub Release.
#
# Deliberately NOT triggered by pull_request: the job needs CERT_SYNC_TOKEN and
# the shared certificate's private key, and a PR from a fork must never be able
# to reach either.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      retroarch:
        description: 'Include the native RetroArch addon'
        type: boolean
        default: true
      publish:
        description: 'Attach the result to a GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Native arm64: the image is arm64 and provisioning executes binaries out
    # of it, so this avoids qemu entirely. Free for public repositories.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            util-linux e2fsprogs fdisk xz-utils curl ca-certificates rsync

      - name: Fetch the current certificate bundle
        id: cert
        env:
          CERT_SYNC_URL: ${{ secrets.CERT_SYNC_URL }}
          CERT_SYNC_TOKEN: ${{ secrets.CERT_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CERT_SYNC_URL:-}" ] || [ -z "${CERT_SYNC_TOKEN:-}" ]; then
            echo "::warning::CERT_SYNC_URL/CERT_SYNC_TOKEN not set — building with a self-signed placeholder certificate. The Tesla browser will reject it."
            echo "bundle=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Same endpoint scripts/cert-sync.sh pulls from on the device, so the
          # image ships whatever the fleet is currently being served.
          dir="$RUNNER_TEMP/cert"
          mkdir -p "$dir"; chmod 700 "$dir"
          for f in fullchain.pem privkey.pem; do
            curl -fsSL --proto '=https' --retry 3 \
              -H "Authorization: Bearer $CERT_SYNC_TOKEN" \
              -o "$dir/$f" "$CERT_SYNC_URL/cert/$f"
          done
          chmod 600 "$dir/privkey.pem"
          # Refuse to ship a mismatched pair — nginx would fail to start and the
          # appliance would serve nothing at all.
          #
          # Compare public keys, not moduli: `-modulus` is RSA-only and the cert
          # is issued with --key-type ecdsa, so the old `openssl rsa -modulus`
          # form failed outright with "Not an RSA key". This matches how
          # renew-cert.yml and cert-sync.sh verify the same pair.
          a=$(openssl x509 -in "$dir/fullchain.pem" -noout -pubkey | openssl sha256)
          b=$(openssl pkey -in "$dir/privkey.pem"   -pubout        | openssl sha256)
          # Both must be non-empty as well as equal: if both openssl calls fail,
          # two empty strings compare equal and a broken pair sails through.
          [ -n "$a" ] && [ -n "$b" ] || { echo "::error::could not read certificate or key"; exit 1; }
          [ "$a" = "$b" ] || { echo "::error::certificate and private key do not match"; exit 1; }
          openssl x509 -in "$dir/fullchain.pem" -noout -subject -dates
          echo "bundle=$dir" >> "$GITHUB_OUTPUT"

      - name: Build image
        env:
          CERT_SYNC_TOKEN: ${{ secrets.CERT_SYNC_TOKEN }}
          CERT_BUNDLE_DIR: ${{ steps.cert.outputs.bundle }}
          TESLAPI_WITH_RETROARCH: ${{ (github.event_name == 'workflow_dispatch' && inputs.retroarch == false) && '0' || '1' }}
          BASE_SHA256: ${{ vars.DIETPI_BASE_SHA256 }}
        run: |
          sudo -E ./image/build-image.sh

      - name: Summarise
        run: |
          {
            echo '### Image built'
            echo
            echo '| file | size | sha256 |'
            echo '|---|---|---|'
            for f in out/*.img.xz; do
              printf '| `%s` | %s | `%s` |\n' \
                "$(basename "$f")" \
                "$(du -h "$f" | cut -f1)" \
                "$(sha256sum "$f" | cut -d' ' -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tesla-pi-image
          path: |
            out/*.img.xz
            out/*.img.xz.sha256
          retention-days: 14
          compression-level: 0

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "$tag" --generate-notes
          gh release upload "$tag" out/*.img.xz out/*.img.xz.sha256 --clobber
