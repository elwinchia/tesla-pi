# Conditional Connection header for the WebSocket upgrade dance. When
# the client sends "Upgrade: websocket", we forward "Connection: upgrade";
# otherwise "Connection: close". Lets a single location block proxy both
# regular HTTP requests (index.html, /healthz) AND WS upgrades on the
# same path.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Tesla MCU connectivity probe. Tesla queries
# connman.vn.tesla.services (or the .cloud.tesla.cn variant) right after
# associating to a new SSID and looks for the X-ConnMan-Status: online
# response header. If that header is present, Tesla considers the
# network "internet OK" and keeps the SSID. If anything else (or the
# request fails entirely) Tesla rejects the network with the dialog
# "The Internet is unreachable. Please check your firewall settings and
# Internet connection". Source: tesla-android's services/lighttpd/lighttpd.conf
# (https://github.com/tesla-android/android-vendor-tesla-android).
server {
    listen 80;
    listen 443 ssl;
    server_name connman.vn.tesla.services connman.vn.cloud.tesla.cn;

    # Re-use the CarPlay-domain cert; Tesla MCU does not appear to
    # validate the cert chain on this probe (tesla-android also serves
    # this with a non-matching cert).
    ssl_certificate     /etc/letsencrypt/live/CARPLAY_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/CARPLAY_DOMAIN/privkey.pem;

    add_header X-ConnMan-Status "online" always;
    add_header X-Cache "Hit from cloudfront" always;
    return 200 "";
}

# Captive-portal bypass: catch-all default server for any HTTP probe
# from any other device (laptop or phone joined to the AP for debugging).
# Returns the responses Android/iOS/Windows expect for their own
# connectivity checks. Tesla MCU does NOT use any of these paths
# (the connman.* server above is what handles the Tesla probe), but
# leaving the default server in place keeps non-Tesla clients happy.
server {
    listen 80 default_server;
    server_name _;

    location = /generate_204            { return 204; }
    location = /gen_204                 { return 204; }

    location = /hotspot-detect.html {
        default_type text/html;
        return 200 '<HTML><HEAD><TITLE>Success</TITLE></HEAD><BODY>Success</BODY></HTML>';
    }
    location = /library/test/success.html {
        default_type text/html;
        return 200 '<HTML><HEAD><TITLE>Success</TITLE></HEAD><BODY>Success</BODY></HTML>';
    }

    location = /ncsi.txt {
        default_type text/plain;
        return 200 'Microsoft NCSI';
    }
    location = /connecttest.txt {
        default_type text/plain;
        return 200 'Microsoft Connect Test';
    }

    location / { return 204; }# Real CarPlay site. Domain is whatever you own; dnsmasq resolves
# everything to 240.3.3.4 anyway, but a matching public A record keeps
# off-AP debugging consistent. Cert is issued off-Pi via DNS-01 and
# copied into /etc/letsencrypt/live/<domain>/ (see tesla-doc.md).
server {
    # HTTP/2 deliberately disabled. nginx 1.26.x (Debian 13 default) can
    # serve WebSocket over HTTP/1.1 upgrade fine, but doesn't translate
    # WebSocket-over-HTTP/2 (RFC 8441 Extended CONNECT) to a backend
    # HTTP/1.1 upgrade — that landed in nginx 1.27.4. Symptom when this
    # is enabled: browser console shows `WebSocket connection failed`
    # and curl --http2 returns 404 "Not found" from the Node app
    # (because nginx forwards the WS upgrade as a regular GET).
    listen 443 ssl;
    server_name CARPLAY_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/CARPLAY_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/CARPLAY_DOMAIN/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/CARPLAY_DOMAIN/chain.pem;

    # Cache the worker + renderer JS aggressively — they only change
    # on a deploy. Tesla browser refetches on every refresh otherwise.
    # `must-revalidate` lets the browser skip the body when ETag matches.
    location ~ ^/(worker|renderer_webgl)\.js$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
    }

    # Single location handles both HTTP and WS upgrades. The frontend
    # connects to /control and /video at the root (per Phase 1 notes:
    # static/index.html opens `wss://<host>/control` and `/video`).
    # Without the Upgrade/Connection headers below, nginx proxies the
    # initial GET fine but doesn't pass through the upgrade dance and
    # the WS handshake fails.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }

    # Legacy /ws/ paths kept for backward compatibility (the Node server
    # accepts both /control and /ws/control).
    location /ws/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }
}

# Plain-HTTP redirect for the CarPlay domain only (the catch-all :80
# server above handles everything else). If a Tesla bookmark ever
# points at http:// we want to bounce it to https://.
server {
    listen 80;
    server_name CARPLAY_DOMAIN;
    return 301 https://$host$request_uri;
}
