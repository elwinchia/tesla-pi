# Route AP clients (the Tesla) out through whatever uplink the Pi has —
# eth0, wlan1 or a USB tether. The matching MASQUERADE and FORWARD rules
# live in conf/iptables.ipv4.nat; scripts/net-share.sh switches dnsmasq
# between forwarding real queries and the offline walled garden.
#
# Safe with no uplink: forwarding only ever matches packets that have
# somewhere to go, and the FORWARD policy stays DROP.
net.ipv4.ip_forward=1
