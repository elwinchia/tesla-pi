# mytesla-pad.cfg — RetroArch joypad autoconfig for scripts/uinput-pad.py's
# virtual gamepad. RetroArch's udev driver matches by name + vendor/product id and
# binds it to a RetroPad automatically. Installed to ~/.config/retroarch/autoconfig/.
#
# CRITICAL: for the `udev` driver, button values are 0-BASED INDICES, NOT evdev
# codes. RetroArch scans the device's EV_KEY bits in ascending code order and
# assigns 0,1,2,… (see libretro/RetroArch input/drivers_joypad/udev_joypad.c).
# uinput-pad.py exposes these buttons; in ascending evdev-code order they get:
#   304 BTN_SOUTH=0  305 BTN_EAST=1  307 BTN_NORTH=2  308 BTN_WEST=3
#   310 BTN_TL=4  311 BTN_TR=5  312 BTN_TL2=6  313 BTN_TR2=7
#   314 BTN_SELECT=8  315 BTN_START=9  316 BTN_MODE=10  317 BTN_THUMBL=11  318 BTN_THUMBR=12
# (Using the raw evdev codes here — the original mistake — leaves every button
# dead while the hat still works, since hats use a separate code path.)
input_driver = "udev"
input_device = "mytesla-virtual-pad"
input_vendor_id = "7531"
input_product_id = "4919"

input_b_btn = "0"
input_a_btn = "1"
input_x_btn = "2"
input_y_btn = "3"
input_l_btn = "4"
input_r_btn = "5"
input_l2_btn = "6"
input_r2_btn = "7"
input_select_btn = "8"
input_start_btn = "9"
input_menu_toggle_btn = "10"
input_l3_btn = "11"
input_r3_btn = "12"

input_up_btn = "h0up"
input_down_btn = "h0down"
input_left_btn = "h0left"
input_right_btn = "h0right"
