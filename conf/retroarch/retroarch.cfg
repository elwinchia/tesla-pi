# retroarch.cfg — curated config for the mytesla native RetroArch addon.
# Installed to __HOME__/.config/retroarch/retroarch.cfg by
# scripts/install-retroarch-addon.sh (which substitutes __HOME__). RetroArch
# fills in every key we omit with its defaults on first run.
#
# config_save_on_exit is OFF so RetroArch never rewrites this file — the kiosk
# config stays exactly as shipped (re-run the installer to change it).
config_save_on_exit = "false"

# --- Video (proven in bring-up: GL context "wayland" on the V3D GPU) ----------
video_driver = "gl"
video_fullscreen = "true"
video_windowed_fullscreen = "true"
# CRITICAL: vsync OFF. The cage output is pinned to a LOW refresh (e.g. 30 Hz) to
# keep wf-recorder's per-frame colour-convert CPU down — but with vsync ON,
# RetroArch gates its whole run loop on that 30 Hz swap, throttling a ~60 fps
# core (and its audio) to HALF speed (slow-motion gameplay + slow audio). With
# vsync off, `audio_sync` below becomes the master clock: the snd-aloop loopback
# runs at true 48 kHz realtime, so the core runs full speed. The compositor still
# only samples the surface at the output refresh, so the encoded stream stays at
# 30 fps and CPU is unchanged — emulation rate is decoupled from encode rate.
video_vsync = "false"
fps_show = "false"
# The cage output is pinned to 720x480@30 by the session launcher before
# RetroArch starts; fullscreen tracks it. Cores letterbox to their own aspect.

# --- Input --------------------------------------------------------------------
# Under cage there is no X — force the Wayland input driver, and the udev joypad
# driver so it reads our /dev/uinput virtual pad (and any BT pad paired to the
# Pi) directly. The autoconfig below binds the virtual pad to RetroPad on port 1.
input_driver = "wayland"
input_joypad_driver = "udev"
joypad_autoconfig_dir = "__HOME__/.config/retroarch/autoconfig"
input_max_users = "1"
menu_swap_ok_cancel_buttons = "false"

# --- Menu ---------------------------------------------------------------------
menu_driver = "ozone"
menu_show_load_core = "true"
menu_show_load_content = "true"

# --- Audio (snd-aloop loopback → the bridge captures hw:Loopback,1,0) ---------
# With vsync OFF (above), audio_sync is the MASTER timing clock: RetroArch blocks
# on the loopback's realtime 48 kHz drain, which paces the core at full speed.
# Do NOT disable audio_sync or the core would free-run unbounded.
audio_driver = "alsa"
audio_device = "hw:Loopback,0,0"
audio_enable = "true"
audio_sync = "true"

# --- Content / save directories ----------------------------------------------
# autosave_interval flushes the in-game battery save (.srm) to disk every N
# seconds when it has changed. RetroArch's default is 0 = flush ONLY on a clean
# content close / exit — fine on a desktop, dangerous in a car where the ignition
# cuts power to the Pi with no clean shutdown (any in-game save since load would
# be lost). 10s makes saves survive an abrupt power cut; SRAM only writes when it
# actually changed, so SD wear is negligible.
autosave_interval = "10"
rgui_browser_directory = "__HOME__/retroarch/roms"
savefile_directory = "__HOME__/retroarch/saves"
savestate_directory = "__HOME__/retroarch/states"
system_directory = "__HOME__/retroarch/system"
