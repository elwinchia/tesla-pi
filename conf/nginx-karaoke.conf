# Karaoke (Nightingale) front door — see docs/karaoke-addon.md.
#
# Why a separate PORT rather than a path under the CarPlay site:
#   The Nightingale SPA is served from the origin ROOT with absolute asset
#   paths (/assets/..., /favicon.png) and no Vite `base`, so it cannot be
#   mounted at /karaoke/ without patching and rebuilding the frontend.
#
# Why a separate port rather than a subdomain:
#   The device cert covers exactly CARPLAY_DOMAIN. A second name would need a
#   cert we cannot issue on-device (see conf/tesla-pi.env.template on why
#   two-deep names are not covered), so we reuse the same hostname on :8443.
#
# Why TLS at all, when this never leaves the car:
#   Pitch scoring needs the cabin mic, and getUserMedia is gated on a secure
#   context. https://CARPLAY_DOMAIN:8443 is one; http:// on any name is not.
#   NOTE: origin includes the port, so the mic grant here is separate from the
#   one on :443 — the driver approves the mic once per origin.

# Distinct variable name on purpose: nginx-carplay.conf already defines
# $connection_upgrade at http level, and a duplicate map is a config error.
map $http_upgrade $karaoke_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8443 ssl;
    server_name CARPLAY_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/CARPLAY_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/CARPLAY_DOMAIN/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/CARPLAY_DOMAIN/chain.pem;

    # Songs are whole audio/video files streamed with Range requests. Default
    # nginx buffering would spool them to disk on the SD card before sending a
    # byte — slow to first note and needless card wear.
    proxy_buffering off;
    proxy_request_buffering off;

    # Lyrics edits and cover art POSTs are small; keep a sane ceiling.
    client_max_body_size 64m;

    # Our additions to a page we cannot edit (the frontend is compiled into the
    # nightingale binary): a back-to-launcher button and car-appropriate echo
    # cancellation. Served from the karaoke origin so it is same-origin script.
    # scripts/install-karaoke-addon.sh strips the sub_filter lines below if this
    # nginx build lacks ngx_http_sub_module.
    location = /_tesla-pi/inject.js {
        alias /etc/nginx/karaoke-inject.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8088;
        # The substitution filter cannot rewrite a gzipped body, so ask the
        # backend for plain text. The payload is a small HTML shell; the big
        # assets are separate requests and keep their own encoding.
        proxy_set_header Accept-Encoding "";
        # `subs_filter`, not nginx's built-in `sub_filter`: Debian's nginx is
        # built WITHOUT ngx_http_sub_module, so the injection rides on the
        # packaged dynamic module libnginx-mod-http-subs-filter instead. The
        # installer adds that package and strips these two lines if it is absent.
        subs_filter_types text/html;
        subs_filter '</body>' '<script src="/_tesla-pi/inject.js"></script></body>' o;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # /ws carries the whole app<->server event stream, so the upgrade dance
        # and a long read timeout are load-bearing, not decoration.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $karaoke_connection_upgrade;
        proxy_read_timeout 86400;
        # Range/If-Range must reach the backend untouched for seeking to work.
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }
}
