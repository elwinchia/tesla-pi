interface=wlan0
bind-interfaces
listen-address=192.168.4.254

dhcp-range=192.168.4.20,192.168.4.50,255.255.255.0,24h
dhcp-option=3,192.168.4.254
dhcp-option=6,192.168.4.254

no-resolv
no-hosts
domain-needed
bogus-priv

# The resolver policy — walled garden when the Pi is offline, real upstream
# lookups when it has an uplink to share — is NOT here. scripts/net-share.sh
# owns it and regenerates /etc/dnsmasq.d/10-tesla-pi-mode.conf on every uplink
# change. Putting a wildcard back in this file would shadow that mode file for
# every name and pin the AP to the offline behaviour.
#
# no-resolv above is deliberate and applies to both modes: the mode file names
# upstream resolvers explicitly rather than inheriting whatever DHCP handed the
# uplink, which on a strange network can be a resolver that only answers for
# its own clients.

# log-dhcp only. log-queries logs EVERY DNS lookup, and on this AP that is not
# a trickle: the car re-resolves constantly, so it measured 74,471 of the
# journal's 74,478 dnsmasq lines in one 4.75h session (37k "config" replies +
# 37k "query[A]/[AAAA]"). That alone blew journald's SystemMaxUse cap in hours
# and evicted the CarPlay logs we actually debug with — the reason several days
# of tesla-pi history were unreadable. DHCP logging is 2 lines per join and is
# what we need for "did the car take a lease", so it stays on.
# Turn queries back on temporarily when chasing a resolver bug:
#   sudo dnsmasq --log-queries  (or uncomment, restart, and re-comment after)
#log-queries
log-dhcp
