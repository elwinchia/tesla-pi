[Service]
# brcmfmac turns 802.11 power save on for wlan0 as hostapd brings the AP up
# ("brcmf_cfg80211_set_power_mgmt: power save enabled" in the boot log), and
# `iw dev wlan0 get power_save` then reads "on" for the AP itself. It buys
# nothing on a Pi that only runs with the car awake, and power save on this
# chip is a known suspect for data stalls while the station stays associated —
# the shape of the outages this was added for. Turned off after hostapd has
# forked (Type=forking, so the AP exists by now); "-" so a missing iw never
# fails the radio.
ExecStartPost=-/usr/sbin/iw dev wlan0 set power_save off
