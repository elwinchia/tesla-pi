name = "tesla-pi-cert-service"
main = "src/worker.js"
compatibility_date = "2026-01-01"

# Served from the free *.workers.dev subdomain:
#   https://tesla-pi-cert-service.<account>.workers.dev
#
# Deliberately NOT a custom hostname. `certs.tesla-pi.humblebees.co` is two
# labels deep, and Cloudflare's free Universal SSL only covers the apex and a
# single-label wildcard (*.humblebees.co) — a two-deep hostname would serve an
# invalid edge certificate and cert-sync.sh would fail its TLS handshake.
# workers.dev gets valid TLS automatically and needs no DNS record at all.
#
# Nothing else depends on the hostname: in the car, dnsmasq resolves
# CARPLAY_DOMAIN to the Pi itself, and DNS-01 issuance validates via a TXT
# record, so cert issuance works at any depth.
workers_dev = true

# Cert artefacts, written by .github/workflows/renew-cert.yml (or by hand with
# the same certbot container). Values are a few KB of PEM/JSON text.
# KV rather than R2: included in the free Workers plan, no payment method.
# Namespace id is filled in by `wrangler kv namespace create CERTS`.
[[kv_namespaces]]
binding = "CERTS"
id = "5136d498a92d4f6abf778cd6ff3c2253"

# DEVICE_TOKEN is a secret, never a var. Set it with:
#   npx wrangler secret put DEVICE_TOKEN
# The same value goes into /etc/default/tesla-pi (mode 0600) on every device.

# Rate limiting — the private key is behind nothing but a bearer token, so cap
# how fast anyone can pull on it. These are Worker bindings, not WAF rules; see
# README.md §8 for why, and for how permissive the limiter really is.
#
# `period` may only be 10 or 60 seconds.

# Charged on every request. A device polls hours apart and fetches three objects
# on a rotation, so this is far above legitimate use.
[[ratelimits]]
name = "RL_REQUESTS"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Charged additionally on a wrong or missing token. A correctly configured
# device never spends from this budget, so it can be very small.
[[ratelimits]]
name = "RL_AUTH_FAILURES"
namespace_id = "1002"
simple = { limit = 3, period = 60 }
